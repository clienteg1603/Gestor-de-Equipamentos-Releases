name: Validar site e backend

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: f89034e4-3a5f-4de4-9c47-9a35f118a641

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Empacotar site e funções como o Netlify
        run: npx --yes netlify-cli@latest build --offline
